name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --target x86_64-pc-windows-msvc
      - name: Release build
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
