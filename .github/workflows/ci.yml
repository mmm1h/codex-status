name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (${{ matrix.channel }}, ${{ matrix.mode }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [default, stable, portable]
        mode: [normal, diagnostics]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        shell: pwsh
        run: |
          if ("${{ matrix.channel }}" -eq "default") {
            Remove-Item Env:CODEX_STATUS_CHANNEL -ErrorAction SilentlyContinue
          } else {
            $env:CODEX_STATUS_CHANNEL = "${{ matrix.channel }}"
          }
          $featureArgs = @()
          if ("${{ matrix.mode }}" -eq "diagnostics") {
            $featureArgs = @("--features", "diagnostics")
          }
          cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc @featureArgs -- -D warnings
      - name: Test
        shell: pwsh
        run: |
          if ("${{ matrix.channel }}" -eq "default") {
            Remove-Item Env:CODEX_STATUS_CHANNEL -ErrorAction SilentlyContinue
          } else {
            $env:CODEX_STATUS_CHANNEL = "${{ matrix.channel }}"
          }
          $featureArgs = @()
          if ("${{ matrix.mode }}" -eq "diagnostics") {
            $featureArgs = @("--features", "diagnostics")
          }
          cargo test --locked --all-targets --target x86_64-pc-windows-msvc @featureArgs
      - name: Release build
        shell: pwsh
        run: |
          if ("${{ matrix.channel }}" -eq "default") {
            Remove-Item Env:CODEX_STATUS_CHANNEL -ErrorAction SilentlyContinue
          } else {
            $env:CODEX_STATUS_CHANNEL = "${{ matrix.channel }}"
          }
          $featureArgs = @()
          if ("${{ matrix.mode }}" -eq "diagnostics") {
            $featureArgs = @("--features", "diagnostics")
          }
          cargo build --locked --release --target x86_64-pc-windows-msvc @featureArgs
