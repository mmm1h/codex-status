name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Verify
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings
          cargo test --locked --all-targets --target x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Stage portable build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Path dist, dist/portable -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/codex-status.exe dist/CodexStatus.exe
          Copy-Item dist/CodexStatus.exe, LICENSE, README.md, README.zh-CN.md dist/portable/
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/CodexStatus-v$version-windows-x64.zip" -CompressionLevel Optimal
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer/CodexStatus.iss
      - name: Checksums
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $assets = @(
            "dist/CodexStatus-v$version-windows-x64.zip",
            "dist/CodexStatus-v$version-Setup-x64.exe"
          )
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))"
          }
          $lines | Set-Content -Encoding ascii "dist/CodexStatus-v$version-SHA256SUMS.txt"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          gh release create "${{ github.ref_name }}" `
            "dist/CodexStatus-v$version-windows-x64.zip" `
            "dist/CodexStatus-v$version-Setup-x64.exe" `
            "dist/CodexStatus-v$version-SHA256SUMS.txt" `
            --verify-tag --title "CodexStatus ${{ github.ref_name }}" --notes-file CHANGELOG.md
